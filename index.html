<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>शैक्षणिक शाळा भेट प्रपत्र</title>
    <!-- CSS File Link -->
    <link rel="stylesheet" href="style.css">
    <!-- html2pdf Library for PDF Generation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body>

    <div class="main-wrapper">
        <!-- PDF मध्ये येणारा मुख्य भाग -->
        <div id="formToPrint" class="form-container">
            
            <!-- मुख्य शीर्षक (इमारतीचा लोगो काढला आहे) -->
            <header class="header-section">
                <h1>शैक्षणिक शाळा भेट प्रपत्र</h1>
            </header>

            <form id="schoolVisitForm">

                <!-- १. सर्वसाधारण व शाळेची माहिती (Card Box) -->
                <div class="card">
                    <div class="card-header">
                        <h3>१. सर्वसाधारण व शाळेची माहिती</h3>
                    </div>
                    <div class="card-body">
                        
                        <!-- १) शाळेचे नाव -->
                        <div class="form-group">
                            <label for="schoolName">शाळेचे नाव निवडा:</label>
                            <select id="schoolName" name="schoolName" required onchange="updateSchoolDetails()">
                                <option value="" data-udise="" data-hm="">-- शाळा निवडा --</option>
                                <option value="जि.प.कें.प्रा.शाळा कन्या नागापूर" data-udise="27280100101" data-hm="श्री.बी.डी.राठोड">जि.प.कें.प्रा.शाळा कन्या नागापूर</option>
                                <option value="जि.प.मा.शाळा नागापूर" data-udise="27280100102" data-hm="श्री.ए बी गायकवाड">जि.प.मा.शाळा नागापूर</option>
                                <option value="जि.प.प्रा.शाळा डाबी" data-udise="27280100201" data-hm="सौ.एम.आर.फड ">जि.प.प्रा.शाळा डाबी</option>
                                <option value="जि.प.प्रा.शाळा डाबी तांडा" data-udise="27280100202" data-hm="श्री.एस.जी.फड">जि.प.प्रा.शाळा डाबी तांडा</option>
                                <option value="जि.प.प्रा.शाळा वानटाकळी" data-udise="27280100301" data-hm="श्री.आर.बी.जोशी">जि.प.प्रा.शाळा वानटाकळी</option>
                                <option value="जि.प.प्रा.शाळा वानटाकळी तांडा" data-udise="27280100302" data-hm="श्री.एम.एन.जाधव">जि.प.प्रा.शाळा वानटाकळी तांडा</option>
                                <option value="जि.प.प्रा.शाळा एकबाली तांडा" data-udise="27280100401" data-hm="श्री.के.बी.माडजे">जि.प.प्रा.शाळा एकबाली तांडा</option>
                                <option value="जि.प.प्रा.शाळा दौनापुर तांडा" data-udise="27280100501" data-hm="श्रीमती एस.के.लाड">जि.प.प्रा.शाळा दौनापुर तांडा</option>
                                <option value="जि.प.प्रा.शाळा दौनापूर" data-udise="27280100502" data-hm="श्री.आर.टी.मंत्रे">जि.प.प्रा.शाळा दौनापूर</option>
                                <option value="जि.प.प्रा.शाळा लिंबूटा तांडा" data-udise="27280100601" data-hm="श्री.एम.बी.बडगिरे">जि.प.प्रा.शाळा लिंबूटा तांडा</option>
                                <option value="जि.प.प्रा.शाळा बहादुरवाडी" data-udise="27280100701" data-hm="श्रीमती चिद्दरवार ए.डी">जि.प.प्रा.शाळा बहादुरवाडी</option>
                                <option value="संत तुकाराम प्राथमिक विद्यालय नागापूर" data-udise="27280100103" data-hm="श्री.एन.पी.मुंडे">संत तुकाराम प्राथमिक विद्यालय नागापूर</option>
                                <option value="रमाबाई प्राथमिक शाळा नागापूर" data-udise="27280100104" data-hm="श्रीमती एस.एस.बनसोडे">रमाबाई प्राथमिक शाळा नागापूर</option>
                                <option value="बालाघाट विद्यालय दौनापूर" data-udise="27280100503" data-hm="श्री.एम.व्ही.कराड">बालाघाट विद्यालय दौनापूर</option>
                            </select>
                        </div>

                        <!-- २) यु-डायस कोड -->
                        <div class="form-group">
                            <label for="udiseCode">शाळेचा यु-डायस क्रमांक (UDISE Code):</label>
                            <input type="text" id="udiseCode" name="udiseCode" placeholder="शाळा निवडल्यावर आपोआप येईल" readonly style="background-color: #f0f0f0;">
                        </div>

                        <!-- ३) मुख्याध्यापकांचे नाव -->
                        <div class="form-group">
                            <label for="headmasterName">मुख्याध्यापकांचे नाव:</label>
                            <input type="text" id="headmasterName" name="headmasterName" placeholder="शाळा निवडल्यावर आपोआप येईल" readonly style="background-color: #f0f0f0;">
                        </div>

                        <hr style="margin: 15px 0; border: 0; border-top: 1px solid #ccc;">

                        <!-- ४) भेट देणाऱ्या अधिकाऱ्याचे नाव व पदनाम (Normal Text, Bold काढले आहे) -->
                        <div class="form-group">
                            <label>भेट देणाऱ्या अधिकाऱ्याचे नाव व पदनाम :-</label>
                            <div style="background-color: #f0f0f0; border: 1px solid #ccc; padding: 10px; border-radius: 4px; font-weight: normal; line-height: 1.6; color: #333;">
                                श्री अनिल बाबुराव चांगिरे, केंद्रप्रमुख /केंद्र समन्वयक<br>
                                समूह साधन केंद्र कन्या नागापूर,<br>
                                ता. परळी वै. जि. बीड
                            </div>
                        </div>

                        <!-- ५) भेटीचा दिनांक -->
                        <div class="form-group">
                            <label for="visitDate">भेटीचा दिनांक:</label>
                            <input type="date" id="visitDate" name="visitDate" required>
                        </div>

                    </div>
                </div>

                <!-- बटन्स (Print/PDF आणि Submit) -->
                <div class="button-group no-print">
                    <button type="button" class="btn btn-pdf" onclick="generatePDF()">📥 PDF डाऊनलोड करा</button>
                    <button type="submit" class="btn btn-submit">☁️ Drive वर सेव्ह करा</button>
                </div>

            </form>
        </div>
    </div>

    <!-- JavaScript code -->
    <script>
        // आजची तारीख बाय-डिफॉल्ट सेट करण्यासाठी
        document.getElementById('visitDate').valueAsDate = new Date();

        // शाळा निवडल्यावर यु-डायस कोड आणि मुख्याध्यापकांचे नाव आपोआप अपडेट होण्याचे फंक्शन
        function updateSchoolDetails() {
            const selectElement = document.getElementById('schoolName');
            const selectedOption = selectElement.options[selectElement.selectedIndex];
            
            const udiseCode = selectedOption.getAttribute('data-udise') || '';
            const headmasterName = selectedOption.getAttribute('data-hm') || '';
            
            document.getElementById('udiseCode').value = udiseCode;
            document.getElementById('headmasterName').value = headmasterName;
        }

        // PDF तयार करण्याचे फंक्शन
        function generatePDF() {
            const element = document.getElementById('formToPrint');
            const options = {
                margin:       10,
                filename:     'शैक्षणिक_शाळा_भेट_प्रपत्र.pdf',
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { scale: 2 },
                jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
            };
            
            document.querySelector('.button-group').style.display = 'none';
            
            html2pdf().set(options).from(element).save().then(() => {
                document.querySelector('.button-group').style.display = 'flex';
            });
        }

        // Google Drive / Sheet सबमिशन
        document.getElementById('schoolVisitForm').addEventListener('submit', function(e) {
            e.preventDefault();
            alert('माहिती Google Drive / Sheet मध्ये सेव्ह होत आहे...');
        });
    </script>
</body>
</html>
