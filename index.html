<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>शैक्षणिक शाळा भेट प्रपत्र</title>
    <!-- CSS File Link -->
    <link rel="stylesheet" href="style.css">
    <!-- html2pdf Library for PDF Generation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body>

    <div class="main-wrapper">
        <!-- PDF मध्ये येणारा मुख्य भाग -->
        <div id="formToPrint" class="form-container">
            
            <!-- मुख्य शीर्षक -->
            <header class="header-section">
                <h1>🏫 शैक्षणिक शाळा भेट प्रपत्र</h1>
            </header>

            <form id="schoolVisitForm">

                <!-- १. शाळेची माहिती (Card Box) -->
                <div class="card">
                    <div class="card-header">
                        <h3>१. शाळेची माहिती</h3>
                    </div>
                    <div class="card-body">
                        <div class="form-group">
                            <label for="schoolName">शाळेचे नाव निवडा:</label>
                            <select id="schoolName" name="schoolName" required>
                                <option value="">-- शाळा निवडा --</option>
                                <label>शाळा निवडा *</label>
      <select id="schoolName">
        <option value="">-- शाळा निवडा --</option>
        <option value="SCH01">जि.प.कें.प्रा.शाळा कन्या नागापूर</option>
        <option value="SCH02">जि.प.मा.शाळा नागापूर</option>
        <option value="SCH03">जि.प.प्रा.शाळा डाबी</option>
        <option value="SCH04">जि.प.प्रा.शाळा डाबी तांडा</option>
        <option value="SCH05">जि.प.प्रा.शाळा वानटाकळी</option>
        <option value="SCH06">जि.प.प्रा.शाळा वानटाकळी तांडा</option>
        <option value="SCH07">जि.प.प्रा.शाळा एकबाली तांडा</option>
        <option value="SCH08">जि.प.प्रा.शाळा दौनापुर तांडा</option>
        <option value="SCH09">जि.प.प्रा.शाळा दौनापूर</option>
        <option value="SCH10">जि.प.प्रा.शाळा लिंबूटा तांडा</option>
        <option value="SCH11">जि.प.प्रा.शाळा बहादूरवाडी</option>
        <option value="SCH12">संत तुकाराम प्राथमिक विद्यालय नागापूर</option>
        <option value="SCH13">रमाबाई प्राथमिक शाळा नागापूर</option>
        <option value="SCH14">बालाघाट विद्यालय दौनापूर</option>
      </select>
    </div>

                <!-- बटन्स (Print/PDF आणि Submit) -->
                <div class="button-group no-print">
                    <button type="button" class="btn btn-pdf" onclick="generatePDF()">📥 PDF डाऊनलोड करा</button>
                    <button type="submit" class="btn btn-submit">☁️ Drive वर सेव्ह करा</button>
                </div>

            </form>
        </div>
    </div>

    <!-- JavaScript code -->
    <script>
        // PDF तयार करण्याचे फंक्शन
        function generatePDF() {
            const element = document.getElementById('formToPrint');
            const options = {
                margin:       10,
                filename:     'शैक्षणिक_शाळा_भेट_प्रपत्र.pdf',
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { scale: 2 },
                jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
            };
            
            // PDF डाऊनलोड करताना बटन्स लपवणे
            document.querySelector('.button-group').style.display = 'none';
            
            html2pdf().set(options).from(element).save().then(() => {
                // PDF डाऊनलोड झाल्यावर बटन्स पुन्हा दाखवणे
                document.querySelector('.button-group').style.display = 'flex';
            });
        }

        // Google Drive / Sheet सबमिशन
        document.getElementById('schoolVisitForm').addEventListener('submit', function(e) {
            e.preventDefault();
            alert('माहिती Google Drive / Sheet मध्ये सेव्ह होत आहे...');
        });
    </script>
</body>
</html>
