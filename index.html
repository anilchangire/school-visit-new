<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>शैक्षणिक शाळा भेट प्रपत्र</title>
    <!-- CSS File Link -->
    <link rel="stylesheet" href="style.css">
    <!-- html2pdf Library for PDF Generation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body>

    <div class="main-wrapper">
        <!-- PDF मध्ये येणारा मुख्य भाग -->
        <div id="formToPrint" class="form-container">
            
            <!-- मुख्य शीर्षक -->
            <header class="header-section">
                <h1>🏫 शैक्षणिक शाळा भेट प्रपत्र</h1>
            </header>

            <form id="schoolVisitForm">

                <!-- १. शाळेची माहिती (Card Box) -->
                <div class="card">
                    <div class="card-header">
                        <h3>१. शाळेची माहिती</h3>
                    </div>
                    <div class="card-body">
                        
                        <!-- शाळेचे नाव -->
                        <div class="form-group">
                            <label for="schoolName">शाळेचे नाव निवडा:</label>
                            <select id="schoolName" name="schoolName" required onchange="updateUdiseCode()">
                                <option value="" data-udise="">-- शाळा निवडा --</option>
                                <option value="जि.प.कें.प्रा.शाळा कन्या नागापूर" data-udise="27270804001">जि.प.कें.प्रा.शाळा कन्या नागापूर</option>
                                <option value="जि.प.मा.शाळा नागापूर" data-udise="27270804002">जि.प.मा.शाळा नागापूर</option>
                                <option value="जि.प.प्रा.शाळा डाबी" data-udise="27270804101">जि.प.प्रा.शाळा डाबी</option>
                                <option value="जि.प.प्रा.शाळा डाबी तांडा" data-udise="27270804701">जि.प.प्रा.शाळा डाबी तांडा</option>
                                <option value="जि.प.प्रा.शाळा वानटाकळी" data-udise="27270804301">जि.प.प्रा.शाळा वानटाकळी</option>
                                <option value="जि.प.प्रा.शाळा वानटाकळी तांडा" data-udise="27270804501">जि.प.प्रा.शाळा वानटाकळी तांडा</option>
                                <option value="जि.प.प्रा.शाळा एकबाली तांडा" data-udise="27270804302">जि.प.प्रा.शाळा एकबाली तांडा</option>
                                <option value="जि.प.प्रा.शाळा दौनापुर तांडा" data-udise="27270804601">जि.प.प्रा.शाळा दौनापुर तांडा</option>
                                <option value="जि.प.प्रा.शाळा दौनापूर" data-udise="27270804201">जि.प.प्रा.शाळा दौनापूर</option>
                                <option value="जि.प.प्रा.शाळा लिंबूटा तांडा" data-udise="27270804801">जि.प.प्रा.शाळा लिंबूटा तांडा</option>
                                <option value="जि.प.प्रा.शाळा बहादुरवाडी" data-udise="27270804401">जि.प.प्रा.शाळा बहादुरवाडी</option>
                                <option value="संत तुकाराम प्राथमिक विद्यालय नागापूर" data-udise="27270804004">संत तुकाराम प्राथमिक विद्यालय नागापूर</option>
                                <option value="रमाबाई प्राथमिक शाळा नागापूर" data-udise="27270804003">रमाबाई प्राथमिक शाळा नागापूर</option>
                                <option value="बालाघाट विद्यालय दौनापूर" data-udise="27270804202">बालाघाट विद्यालय दौनापूर</option>
                            </select>
                        </div>

                        <!-- यु-डायस कोड (आपोआप भरणारा ऑटो-फील्ड) -->
                        <div class="form-group">
                            <label for="udiseCode">शाळेचा यु-डायस क्रमांक (UDISE Code):</label>
                            <input type="text" id="udiseCode" name="udiseCode" placeholder="शाळा निवडल्यावर आपोआप येईल" readonly style="background-color: #f0f0f0;">
                        </div>

                    </div>
                </div>

                <!-- बटन्स (Print/PDF आणि Submit) -->
                <div class="button-group no-print">
                    <button type="button" class="btn btn-pdf" onclick="generatePDF()">📥 PDF डाऊनलोड करा</button>
                    <button type="submit" class="btn btn-submit">☁️ Drive वर सेव्ह करा</button>
                </div>

            </form>
        </div>
    </div>

    <!-- JavaScript code -->
    <script>
        // शाळा निवडल्यावर यु-डायस कोड आपोआप अपडेट होण्याचे फंक्शन
        function updateUdiseCode() {
            const selectElement = document.getElementById('schoolName');
            const selectedOption = selectElement.options[selectElement.selectedIndex];
            const udiseCode = selectedOption.getAttribute('data-udise') || '';
            
            document.getElementById('udiseCode').value = udiseCode;
        }

        // PDF तयार करण्याचे फंक्शन
        function generatePDF() {
            const element = document.getElementById('formToPrint');
            const options = {
                margin:       10,
                filename:     'शैक्षणिक_शाळा_भेट_प्रपत्र.pdf',
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { scale: 2 },
                jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
            };
            
            document.querySelector('.button-group').style.display = 'none';
            
            html2pdf().set(options).from(element).save().then(() => {
                document.querySelector('.button-group').style.display = 'flex';
            });
        }

        // Google Drive / Sheet सबमिशन
        document.getElementById('schoolVisitForm').addEventListener('submit', function(e) {
            e.preventDefault();
            alert('माहिती Google Drive / Sheet मध्ये सेव्ह होत आहे...');
        });
    </script>
</body>
</html>
